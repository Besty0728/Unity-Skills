name: Optional Package Live Tests

# Manual only: installs every optional package the skills integrate with (registry + OpenUPM; DOTween, QFramework
# and HybridCLR are not distributable here) and runs EditMode with a per-module floor of tests that actually passed,
# so a fixture that silently ignores itself fails the run instead of passing with zero failures.
"on":
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  optional-packages:
    name: Unity ${{ matrix.unityVersion }} optional packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - unityVersion: 6000.3.18f1
            floorsKey: "6000"
          - unityVersion: 2022.3.62f1
            floorsKey: "2022"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create test project with optional packages
        env:
          UNITY_VERSION: ${{ matrix.unityVersion }}
        run: |
          set -euo pipefail
          mkdir -p TempUnityProject/Assets TempUnityProject/Packages TempUnityProject/ProjectSettings
          if [[ "$UNITY_VERSION" == 6000.* ]]; then
          cat > TempUnityProject/Packages/manifest.json <<JSON
          {
            "scopedRegistries": [
              {
                "name": "package.openupm.com",
                "url": "https://package.openupm.com",
                "scopes": ["com.tuyoogame.yooasset", "com.kyrylokuzyk.primetween"]
              }
            ],
            "dependencies": {
              "com.unity.test-framework": "1.4.5",
              "com.unity.testtools.codecoverage": "1.3.0",
              "com.unity.ugui": "2.0.0",
              "com.unity.render-pipelines.universal": "17.3.0",
              "com.unity.shadergraph": "17.3.0",
              "com.unity.probuilder": "6.1.2",
              "com.unity.cinemachine": "3.1.7",
              "com.unity.netcode.gameobjects": "2.13.3",
              "com.unity.addressables": "3.1.0",
              "com.unity.splines": "2.9.1",
              "com.unity.xr.interaction.toolkit": "3.6.1",
              "com.unity.behavior": "1.0.16",
              "com.unity.timeline": "1.8.13",
              "com.tuyoogame.yooasset": "2.3.19",
              "com.kyrylokuzyk.primetween": "1.3.3",
              "com.unity.modules.physics2d": "1.0.0",
              "com.besty.unity-skills": "file:../../SkillsForUnity"
            },
            "testables": ["com.besty.unity-skills"]
          }
          JSON
          else
          cat > TempUnityProject/Packages/manifest.json <<JSON
          {
            "dependencies": {
              "com.unity.test-framework": "1.4.5",
              "com.unity.testtools.codecoverage": "1.3.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.render-pipelines.universal": "14.0.12",
              "com.unity.shadergraph": "14.0.12",
              "com.unity.probuilder": "5.2.4",
              "com.unity.cinemachine": "2.10.2",
              "com.unity.xr.interaction.toolkit": "2.6.5",
              "com.besty.unity-skills": "file:../../SkillsForUnity"
            },
            "testables": ["com.besty.unity-skills"]
          }
          JSON
          fi
          echo "m_EditorVersion: $UNITY_VERSION" > TempUnityProject/ProjectSettings/ProjectVersion.txt
          cat TempUnityProject/Packages/manifest.json

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: TempUnityProject/Library
          key: OptLibrary-${{ runner.os }}-${{ matrix.unityVersion }}-${{ hashFiles('TempUnityProject/Packages/manifest.json') }}
          restore-keys: |
            OptLibrary-${{ runner.os }}-${{ matrix.unityVersion }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: false
          projectPath: TempUnityProject
          unityVersion: ${{ matrix.unityVersion }}
          testMode: EditMode
          artifactsPath: artifacts/optional-${{ matrix.unityVersion }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.x'

      - name: Check per-module floors of passed live tests
        shell: bash
        run: |
          set -euo pipefail
          xml=$(find "${{ steps.tests.outputs.artifactsPath }}" -name '*.xml' | head -1)
          test -n "$xml"
          python3 .github/scripts/nunit_floors.py "$xml" .github/optional-package-floors.json "${{ matrix.floorsKey }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-package-results-${{ matrix.unityVersion }}
          path: ${{ steps.tests.outputs.artifactsPath }}
