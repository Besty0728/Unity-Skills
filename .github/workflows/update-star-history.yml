name: Update Star History

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update-star-history:
    name: Render official Star History SVGs
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAR_HISTORY_REPOSITORY: Besty0728/Unity-Skills
      STAR_HISTORY_SOURCE_REF: bcddc9d532b10bac7e0187a741288bf9cab17616
      STAR_HISTORY_SOURCE_DIR: .star-history-upstream
      STAR_HISTORY_PORT: "18080"

    steps:
      - uses: actions/checkout@v4

      - name: Check out official Star History renderer
        uses: actions/checkout@v4
        with:
          repository: star-history/star-history
          ref: ${{ env.STAR_HISTORY_SOURCE_REF }}
          path: ${{ env.STAR_HISTORY_SOURCE_DIR }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            ${{ env.STAR_HISTORY_SOURCE_DIR }}/pnpm-lock.yaml
            ${{ env.STAR_HISTORY_SOURCE_DIR }}/backend/pnpm-lock.yaml

      - name: Install official renderer dependencies
        run: |
          set -euo pipefail
          (cd "${STAR_HISTORY_SOURCE_DIR}" && pnpm install --frozen-lockfile)
          (cd "${STAR_HISTORY_SOURCE_DIR}/backend" && pnpm install --frozen-lockfile)

      - name: Allow official renderer to use a free port
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["STAR_HISTORY_SOURCE_DIR"]) / "backend/main.ts"
          source = path.read_text(encoding="utf-8")
          original_server = "serve({ fetch: app.fetch, port: 8080 }, () => {"
          patched_server = "const port = Number(process.env.PORT || 8080);\n  serve({ fetch: app.fetch, port }, () => {"
          if original_server not in source and patched_server not in source:
              raise SystemExit("official renderer port bootstrap changed upstream")
          source = source.replace(
              "serve({ fetch: app.fetch, port: 8080 }, () => {",
              patched_server,
          )
          source = source.replace(
              'logger.info("server running on port 8080");',
              'logger.info("server running on port " + port);',
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Render static Star History charts
        env:
          STAR_HISTORY_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
          GH_STARGAZERS_TOKEN: ${{ secrets.GH_STARGAZERS_TOKEN }}
          GITHUB_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          token_file="${RUNNER_TEMP}/star-history-token.env"
          server_log="${RUNNER_TEMP}/star-history-backend.log"
          if [[ -n "${STAR_HISTORY_TOKEN}" ]]; then
            printf '%s\n' "${STAR_HISTORY_TOKEN}" > "${token_file}"
            api_token="${STAR_HISTORY_TOKEN}"
          elif [[ -n "${GH_STARGAZERS_TOKEN}" ]]; then
            printf '%s\n' "${GH_STARGAZERS_TOKEN}" > "${token_file}"
            api_token="${GH_STARGAZERS_TOKEN}"
          elif [[ -n "${GITHUB_JOB_TOKEN}" ]]; then
            printf '%s\n' "${GITHUB_JOB_TOKEN}" > "${token_file}"
            api_token="${GITHUB_JOB_TOKEN}"
          else
            echo "::error::No GitHub token is available for Star History rendering."
            exit 1
          fi

          probe_file="${RUNNER_TEMP}/star-history-token-probe.json"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Accept: application/vnd.github.star+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: token ${api_token}" \
            "https://api.github.com/repos/${STAR_HISTORY_REPOSITORY}/stargazers?per_page=1" \
            --output "${probe_file}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          probe = json.loads(Path(os.environ["RUNNER_TEMP"], "star-history-token-probe.json").read_text())
          if not isinstance(probe, list) or not probe:
              raise SystemExit("GitHub token probe returned no stargazers")
          if "starred_at" not in probe[0]:
              raise SystemExit("GitHub token probe did not include starred_at")
          print("GitHub token probe passed for timestamped stargazers.")
          PY

          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          (cd "${STAR_HISTORY_SOURCE_DIR}/backend" && pnpm run build)
          (
            cd "${STAR_HISTORY_SOURCE_DIR}/backend"
            ENVPATH="${token_file}" PORT="${STAR_HISTORY_PORT}" pnpm exec tsx main.ts
          ) >"${server_log}" 2>&1 &
          server_pid=$!

          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:${STAR_HISTORY_PORT}/healthz" >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}" >&2
              exit 1
            fi
            if [[ "${attempt}" == 60 ]]; then
              cat "${server_log}" >&2
              exit 1
            fi
            sleep 1
          done

          mkdir -p docs
          tmp_dir="${RUNNER_TEMP}/star-history-svg"
          mkdir -p "${tmp_dir}"
          base_url="http://127.0.0.1:${STAR_HISTORY_PORT}/svg?repos=${STAR_HISTORY_REPOSITORY}&type=date&legend=top-left"
          light_status="$(curl --silent --show-error --location --max-time 120 \
            --write-out '%{http_code}' \
            "${base_url}" \
            --output "${tmp_dir}/star-history-light.svg")"
          dark_status="$(curl --silent --show-error --location --max-time 120 \
            --write-out '%{http_code}' \
            "${base_url}&theme=dark" \
            --output "${tmp_dir}/star-history-dark.svg")"
          if [[ "${light_status}" != "200" || "${dark_status}" != "200" ]]; then
            echo "::error::Star History renderer returned light=${light_status}, dark=${dark_status}."
            echo "Light response preview:"
            head -c 1000 "${tmp_dir}/star-history-light.svg" || true
            echo
            echo "Dark response preview:"
            head -c 1000 "${tmp_dir}/star-history-dark.svg" || true
            echo
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          checks = {
              "star-history-light.svg": "background:#fff",
              "star-history-dark.svg": "background:#0d1117",
          }
          tmp_dir = Path(__import__("os").environ["RUNNER_TEMP"]) / "star-history-svg"
          for filename, background in checks.items():
              content = (tmp_dir / filename).read_text(encoding="utf-8")
              if len(content) < 10000:
                  raise SystemExit(f"{filename} is unexpectedly small")
              root = ET.fromstring(content)
              if root.tag.rsplit("}", 1)[-1] != "svg":
                  raise SystemExit(f"{filename} is not an SVG")
              required = [
                  "Star History",
                  "GitHub Stars",
                  "xkcdify",
                  "font-family:xkcd",
                  "besty0728/unity-skills",
                  background,
              ]
              missing = [fragment for fragment in required if fragment not in content]
              if missing:
                  raise SystemExit(f"{filename} is missing: {', '.join(missing)}")
          PY
          mv "${tmp_dir}/star-history-light.svg" docs/star-history-light.svg
          mv "${tmp_dir}/star-history-dark.svg" docs/star-history-dark.svg

      - name: Commit updated charts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/star-history-light.svg docs/star-history-dark.svg; then
            echo "Star History charts are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/star-history-light.svg docs/star-history-dark.svg
          git commit -m "docs: update Star History charts"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            git fetch origin beta
            if git merge-base --is-ancestor origin/beta HEAD; then
              git push origin HEAD:beta
            else
              echo "origin/beta has diverged; skipping beta fast-forward sync."
            fi
          fi
